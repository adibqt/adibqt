<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="Adib Rahman — full-stack engineer, applied AI systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1622"/>
      <stop offset="55%" stop-color="#122b3a"/>
      <stop offset="100%" stop-color="#0e2230"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3a7"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="280" rx="18"/>
    </clipPath>

    <style>
      .node   { animation: breathe 4.5s ease-in-out infinite; }
      .n2     { animation-delay: -0.7s; }
      .n3     { animation-delay: -1.4s; }
      .n4     { animation-delay: -2.1s; }
      .n5     { animation-delay: -2.8s; }
      .n6     { animation-delay: -3.5s; }
      .edge   { animation: flicker 6s ease-in-out infinite; }
      .e2     { animation-delay: -2s; }
      .e3     { animation-delay: -4s; }
      .sweep  { animation: slide 9s linear infinite; }
      .caret  { animation: blink 1.1s step-end infinite; }
      .cluster{ animation: drift 14s ease-in-out infinite alternate; }

      @keyframes breathe { 0%,100% { opacity:.30 } 50% { opacity:1 } }
      @keyframes flicker { 0%,100% { opacity:.12 } 50% { opacity:.42 } }
      @keyframes slide   { 0% { transform: translateX(-420px) } 100% { transform: translateX(1300px) } }
      @keyframes blink   { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
      @keyframes drift   { from { transform: translateY(0) } to { transform: translateY(-10px) } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <ellipse cx="960" cy="140" rx="300" ry="190" fill="url(#glow)"/>
    <rect class="sweep" x="0" y="0" width="420" height="280" fill="url(#sweep)"/>

    <!-- left accent rail -->
    <rect x="0" y="0" width="6" height="280" fill="url(#accent)"/>

    <!-- vector-space cluster -->
    <g class="cluster" transform="translate(880 140)">
      <g stroke="#7dd3fc" stroke-width="1.1" fill="none">
        <path class="edge"    d="M0 0 L96 -62 M0 0 L-88 -46 M0 0 L74 58 M0 0 L-56 76 M0 0 L138 6 M0 0 L-134 18"/>
        <path class="edge e2" d="M96 -62 L138 6 M-88 -46 L-134 18 M74 58 L138 6 M-56 76 L74 58"/>
        <path class="edge e3" d="M-88 -46 L96 -62 M-134 18 L-56 76 M96 -62 L44 -108 M-56 76 L18 112"/>
      </g>
      <g fill="#38bdf8">
        <circle class="node"    cx="96"  cy="-62" r="5"/>
        <circle class="node n2" cx="-88" cy="-46" r="4"/>
        <circle class="node n3" cx="74"  cy="58"  r="4.5"/>
        <circle class="node n4" cx="-56" cy="76"  r="4"/>
        <circle class="node n5" cx="138" cy="6"   r="3.5"/>
        <circle class="node n6" cx="-134" cy="18" r="3.5"/>
        <circle class="node n3" cx="44"  cy="-108" r="3"/>
        <circle class="node n5" cx="18"  cy="112"  r="3"/>
        <circle class="node n2" cx="-160" cy="-92" r="2.5"/>
        <circle class="node n4" cx="168" cy="-118" r="2.5"/>
        <circle class="node n6" cx="152" cy="96"   r="2.5"/>
        <circle class="node"    cx="-118" cy="112" r="2.5"/>
      </g>
      <circle cx="0" cy="0" r="9" fill="#22d3a7"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#22d3a7" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle class="node" cx="0" cy="0" r="30" fill="none" stroke="#22d3a7" stroke-opacity="0.18" stroke-width="1"/>
    </g>

    <!-- wordmark -->
    <g id="wordmark" font-family="Helvetica, Arial, sans-serif">
      <text x="64" y="92" font-size="15" letter-spacing="4.5" fill="#22d3a7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">~/adib <tspan class="caret" fill="#22d3a7">▮</tspan></text>
      <text x="62" y="158" font-size="60" font-weight="700" letter-spacing="1.5" fill="#f8fafc">ADIB RAHMAN</text>
      <text x="64" y="196" font-size="19" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">full-stack engineer · applied AI systems</text>
      <text x="64" y="228" font-size="14.5" letter-spacing="1.2" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">RAG pipelines &#183; realtime infra &#183; healthcare tech &#183; Bangla NLP</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="279" rx="18" fill="none" stroke="#38bdf8" stroke-opacity="0.22"/>
  </g>
</svg>
